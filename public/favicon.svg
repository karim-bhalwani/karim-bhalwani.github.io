<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#121316" />
  <!-- Hexagonal / Node Network Pattern -->
  <path d="M32 14 L48 23 L48 41 L32 50 L16 41 L16 23 Z" fill="none" stroke="#2d3139" stroke-width="2.5" />
  <!-- Connecting Links -->
  <line x1="32" y1="14" x2="32" y2="32" stroke="#e06c3a" stroke-width="2.5" stroke-linecap="round" />
  <line x1="48" y1="41" x2="32" y2="32" stroke="#e06c3a" stroke-width="2.5" stroke-linecap="round" />
  <line x1="16" y1="41" x2="32" y2="32" stroke="#e06c3a" stroke-width="2.5" stroke-linecap="round" />
  <!-- Core Nodes -->
  <circle cx="32" cy="14" r="3.5" fill="#f08544" />
  <circle cx="48" cy="23" r="3" fill="#606675" />
  <circle cx="48" cy="41" r="3.5" fill="#f08544" />
  <circle cx="32" cy="50" r="3" fill="#606675" />
  <circle cx="16" cy="41" r="3.5" fill="#f08544" />
  <circle cx="16" cy="23" r="3" fill="#606675" />
  <!-- Central Hub Node -->
  <circle cx="32" cy="32" r="5" fill="#e06c3a" />
  <circle cx="32" cy="32" r="2" fill="#ffffff" />
</svg>
